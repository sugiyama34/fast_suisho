name = "check-full-e2-zs-teach-f5-vs-full-e2-300k"
a = { ablate = "full-e2-zs-teach-f5", ckpt = "009-full/0002", select = "--arm full --percent 5 --by features", mode = "zero-specific", verify = true }
b = "009-full/0002"
nodes = 300000
pairs = 100
priority = 20
note = "パイプライン確認"


# experiment-011 の対局キュー (match_queue.py が 1 分ごとに読み直す)。書き方:
# [[job]]
# name = "..."                 # games/<name>/ に棋譜と summary.json
# a = "011-s-pcalm-T4-eta0.2/0001"   # checkpoint (data/bulletou/checkpoints/ からの相対) か "suisho11"
# a_fv = 48                    # FV_SCALE (省略時 16)
# b = "011-s-bp-lr1/0001"
# b_fv = 48
# nodes = 300000
# pairs = 300
# priority = 10                # 小さいほど先
# engine = "<path>"            # 省略時は experiment-009 と同じバイナリ (~/engines/009-finny-avx2/)
#
# M2 の調整対局 (2026-10-06 Claude 決定): すべての候補 (bp-recipe = s-bp-lr1 を含む) を、候補ではない BP の複製
# (s-bp-lr1-rot, 教師の順序を回転) の e1 と対局させる。全候補を同じ相手で測るので対称 (bp-recipe だけ 0 に固定されない)。
# 相手が同程度の強さなので水匠 11 相手より区間が狭い (300 ペアで約 ±28 Elo 対 ±39 Elo)。
# 両方 FV_SCALE 48、300 ペア、300k ノード。
# エンジンは kajiki のビルド (a5f519d2, V9.60 + finny.patch, AVX2)。調整対局は 1 つの系列の中の相対比較なので、
# 009 のバイナリ (423b6b1c, suzuki から複製待ち) が届くかどうかによらず、この系列はすべて kajiki のビルドで揃える。
# 本番 (M4) の対局は 009 のバイナリを使う
#
# PC-ALM / PC のネットは出力側を 1/k に縮めた nn.bin (export_rescaled.py, rescale_watch.py が自動で作る,
# /mnt/D/sugiyama/011/rescaled/) を使い、FV_SCALE も 1/k (k = 2 なら 48 → 24) にして探索での評価値を揃える。
# BulletOu の書き出しのままだと L3 の実効重みが int8 の範囲を超えて切り詰められる (notes/m0.md)。BP のネットは k = 1 (元のまま)

[[job]]
name = "tune-s-bp-lr1-e1@48-vs-bp-rep-e1@48-300k"
a = "011-s-bp-lr1/0001"
a_fv = 48
b = "011-s-bp-lr1-rot/0001"
b_fv = 48
nodes = 300000
pairs = 300
priority = 10
engine = "~/engines/yane-9133c527-finny-avx2/YaneuraOu-by-gcc"
note = "M2: bp-recipe (BP のレシピ値)。複製との差 = ノイズの目安"

